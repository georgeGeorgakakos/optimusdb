# Update 21.09.2025
#apiVersion: v1
#kind: Namespace
#metadata:
#  name: optimusdb
#---
apiVersion: v1
kind: ConfigMap
metadata:
  name: optimusdb-config
  namespace: default
data:
  OPTIMUSDB_API_PORT: "8089"
  OPTIMUSDB_P2P_PORT: "4001"
  OPTIMUSDB_GATEWAY_PORT: "5001"
  OPTIMUSDB_LOG_LEVEL: "info"
  # Optional: hard-code seed peers (uncomment & fill if needed)
  # OPTIMUSDB_SEED_PEERS: "optimusdb-0.optimusdb-headless.optimusdb.svc.cluster.local:4001,optimusdb-1.optimusdb-headless.optimusdb.svc.cluster.local:4001,optimusdb-2.optimusdb-headless.optimusdb.svc.cluster.local:4001"
---
# Headless service for stable pod DNS: optimusdb-0.optimusdb-headless.optimusdb.svc
apiVersion: v1
kind: Service
metadata:
  name: optimusdb-headless
  namespace: default
spec:
  clusterIP: None
  selector:
    app: optimusdb
  ports:
    - name: api
      port: 8089
      targetPort: 8089
    - name: p2p
      port: 4001
      targetPort: 4001
    - name: gateway
      port: 5001
      targetPort: 5001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: optimusdb
  namespace: default
spec:
  serviceName: optimusdb-headless
  replicas: 3
  selector:
    matchLabels:
      app: optimusdb
  template:
    metadata:
      labels:
        app: optimusdb
    spec:
      containers:
        - name: optimusdb
          image: ghcr.io/georgegeorgakakos/optimusdb:latest
          #imagePullPolicy: IfNotPresent
          imagePullPolicy: Always
          ports:
            - name: api
              containerPort: 8089
            - name: p2p
              containerPort: 4001
            - name: gateway
              containerPort: 5001
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: OPTIMUSDB_API_PORT
              valueFrom: { configMapKeyRef: { name: optimusdb-config, key: OPTIMUSDB_API_PORT } }
            - name: OPTIMUSDB_P2P_PORT
              valueFrom: { configMapKeyRef: { name: optimusdb-config, key: OPTIMUSDB_P2P_PORT } }
            - name: OPTIMUSDB_GATEWAY_PORT
              valueFrom: { configMapKeyRef: { name: optimusdb-config, key: OPTIMUSDB_GATEWAY_PORT } }
            - name: OPTIMUSDB_LOG_LEVEL
              valueFrom: { configMapKeyRef: { name: optimusdb-config, key: OPTIMUSDB_LOG_LEVEL } }
            # - name: OPTIMUSDB_SEED_PEERS
            #   valueFrom: { configMapKeyRef: { name: optimusdb-config, key: OPTIMUSDB_SEED_PEERS } }
            # EMS integration (ActiveMQ STOMP)
            - name: EMS_SERVICE_NAME
              value: "emsserver-ems-server"
            - name: EMS_NAMESPACE
              value: "default"
            - name: EMS_STOMP_PORT
              value: "61613"          # matches EMS container
            - name: EMS_TOPIC
              value: "/topic/>"       # subscribe to ALL topics
            - name: MQ_USER
              value: "aaa"
            - name: MQ_PASS
              value: "111"
            - name: MQ_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name # each pod gets unique durable client ID
          # Safer generic probes (TCP) in case /healthz isn’t implemented
          readinessProbe:
            tcpSocket: { port: 8089 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8089 }
            initialDelaySeconds: 15
            periodSeconds: 20

          volumeMounts:
            - name: data
              mountPath: /var/lib/optimusdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
---
# Per-pod Services to mimic your distinct host port mapping.
# Requires MetalLB (or another LB) to allocate external IPs.

apiVersion: v1
kind: Service
metadata:
  name: optimusdb-0
  namespace: default
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    statefulset.kubernetes.io/pod-name: optimusdb-0
  ports:
    - name: api
      port: 18001
      targetPort: 8089
      protocol: TCP
    - name: p2p
      port: 14001
      targetPort: 4001
      protocol: TCP
    - name: gateway
      port: 15001
      targetPort: 5001
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: optimusdb-1
  namespace: default
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    statefulset.kubernetes.io/pod-name: optimusdb-1
  ports:
    - name: api
      port: 18002
      targetPort: 8089
      protocol: TCP
    - name: p2p
      port: 14002
      targetPort: 4001
      protocol: TCP
    - name: gateway
      port: 15002
      targetPort: 5001
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: optimusdb-2
  namespace: default
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    statefulset.kubernetes.io/pod-name: optimusdb-2
  ports:
    - name: api
      port: 18003
      targetPort: 8089
      protocol: TCP
    - name: p2p
      port: 14003
      targetPort: 4001
