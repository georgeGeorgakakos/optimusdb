  type: NodePort
  selector:
    app: optimusdb
    node: "1"
  ports:
    - name: api
      port: 8089
      targetPort: 8089
      nodePort: 30001
      protocol: TCP
    - name: p2p
      port: 4001
      targetPort: 4001
      nodePort: 30011
      protocol: TCP
    - name: gateway
      port: 5001
      targetPort: 5001
      nodePort: 30021
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: optimusdb1
  namespace: optimusddc
  labels:
    app: optimusdb
    node: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: optimusdb
      node: "1"
  template:
    metadata:
      labels:
        app: optimusdb
        node: "1"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: optimusdb
          image: ghcr.io/georgegeorgakakos/optimusdb:latest
          imagePullPolicy: Always
          ports:
            - name: api
              containerPort: 8089
              protocol: TCP
            - name: p2p
              containerPort: 4001
              protocol: TCP
            - name: gateway
              containerPort: 5001
              protocol: TCP
          env:
            - name: POD_NAME
              value: "optimusdb1"
            - name: NODE_ID
              value: "1"
            - name: NODE_NAME
              value: "optimusdb1"
            - name: OPTIMUSDB_API_PORT
              valueFrom:
                configMapKeyRef:
                  name: optimusdb-config
                  key: OPTIMUSDB_API_PORT
            - name: OPTIMUSDB_P2P_PORT
              valueFrom:
                configMapKeyRef:
                  name: optimusdb-config
                  key: OPTIMUSDB_P2P_PORT
            - name: OPTIMUSDB_GATEWAY_PORT
              valueFrom:
                configMapKeyRef:
                  name: optimusdb-config
                  key: OPTIMUSDB_GATEWAY_PORT
            - name: OPTIMUSDB_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: optimusdb-config
                  key: OPTIMUSDB_LOG_LEVEL
            - name: OPTIMUSDB_CONTEXT
              valueFrom:
                configMapKeyRef:
                  name: optimusdb-config
                  key: OPTIMUSDB_CONTEXT
            - name: OPTIMUSDB_BENCHMARK
              valueFrom:
                configMapKeyRef:
                  name: optimusdb-config
                  key: OPTIMUSDB_BENCHMARK
            # EMS integration via SSH tunnel (ActiveMQ STOMP)
            - name: HOST_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: EMS_SERVICE_NAME
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: EMS_STOMP_PORT
              value: "61610"
            - name: EMS_TOPIC
              value: "/topic/>"
            - name: MQ_USER
              value: "aaa"
            - name: MQ_PASS
              value: "111"
            - name: MQ_CLIENT_ID
              value: "$(POD_NAME)"
          startupProbe:
            tcpSocket:
              port: 8089
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8089
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/optimusdb
          resources:
            limits:
              memory: "768Mi"
              cpu: "500m"
            requests:
              memory: "384Mi"
              cpu: "100m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: optimusdb1-data
