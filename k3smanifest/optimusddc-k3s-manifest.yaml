# Keycloak Realm with Pre-configured Users
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: optimusddc
data:
  optimusddc-realm.json: |
    {
      "realm": "optimusddc",
      "enabled": true,
      "displayName": "OptimusDDC",
      "sslRequired": "none",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "permanentLockout": false,
      "maxFailureWaitSeconds": 900,
      "failureFactor": 5,
      "clients": [
        {
          "clientId": "amundsen-frontend",
          "name": "OptimusDDC Frontend",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "optimusddc-secret-2025",
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "protocol": "openid-connect",
          "publicClient": false,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "fullScopeAllowed": true,
          "defaultClientScopes": ["web-origins", "profile", "roles", "email"]
        }
      ],
      "users": [
        {
          "username": "demo",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Demo",
          "lastName": "User",
          "email": "demo@optimusddc.com",
          "credentials": [{"type": "password", "value": "demo123", "temporary": false}]
        },
        {
          "username": "admin",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Admin",
          "lastName": "User",
          "email": "admin@optimusddc.com",
          "credentials": [{"type": "password", "value": "admin123", "temporary": false}]
        },
        {
          "username": "analyst",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Data",
          "lastName": "Analyst",
          "email": "analyst@optimusddc.com",
          "credentials": [{"type": "password", "value": "analyst123", "temporary": false}]
        },
        {
          "username": "scientist",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Data",
          "lastName": "Scientist",
          "email": "scientist@optimusddc.com",
          "credentials": [{"type": "password", "value": "scientist123", "temporary": false}]
        }
      ],
