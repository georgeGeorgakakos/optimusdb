# ==================== CATALOG FRONTEND WITH CUSTOM AUTH ====================
apiVersion: v1
kind: Service
metadata:
  name: catalogfrontend
  namespace: optimusddc
spec:
  type: ClusterIP
  selector:
    app: catalogfrontend
  ports:
    - name: http
      port: 5015
      targetPort: 5015
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogfrontend
  namespace: optimusddc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogfrontend
  template:
    metadata:
      labels:
        app: catalogfrontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        # Init container copies custom auth files from ConfigMaps to shared volume
        - name: setup-custom-auth
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              echo "================================================"
              echo "Setting up custom authentication files..."
              echo "================================================"
              mkdir -p /app-files/templates /app-files/static/css
              echo "✓ Created directories"
              
              cp /mnt/custom-auth/custom_auth_config.py /app-files/
              echo "✓ Copied custom_auth_config.py"
              
              cp /mnt/login-template/login.html /app-files/templates/
              echo "✓ Copied login.html"
              
              cp /mnt/login-scss/login.scss /app-files/static/css/
              echo "✓ Copied login.scss"
              
              chmod -R 644 /app-files/
              echo "✓ Set permissions"
              
              echo ""
              echo "Files in /app-files:"
              ls -lah /app-files/
              echo ""
              echo "Files in /app-files/templates:"
              ls -lah /app-files/templates/
              echo ""
              echo "Files in /app-files/static/css:"
              ls -lah /app-files/static/css/
              echo ""
              echo "================================================"
              echo "✓ Custom authentication setup complete!"
              echo "================================================"
          volumeMounts:
            - name: custom-auth
              mountPath: /mnt/custom-auth
            - name: login-template
              mountPath: /mnt/login-template
            - name: login-scss
              mountPath: /mnt/login-scss
            - name: app-files
              mountPath: /app-files
      containers:
        - name: catalogfrontend
          image: ghcr.io/georgegeorgakakos/optimusddc/catalogfrontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5015
              protocol: TCP
          env:
            # ============ Custom Authentication Configuration ============
            - name: FRONTEND_SVC_CONFIG_MODULE_CLASS
              value: "amundsen_application.custom_auth_config.CustomAuthConfig"

            # Keycloak Backend Configuration
            - name: KEYCLOAK_URL
              value: "http://keycloak:8080"
            - name: KEYCLOAK_REALM
              value: "optimusddc"
            - name: KEYCLOAK_CLIENT_ID
              value: "amundsen-frontend"
            - name: KEYCLOAK_CLIENT_SECRET
              value: "optimusddc-secret-2025"

            # Session Configuration
            - name: FLASK_SECRET_KEY
              value: "OptimusDDC-Production-Secret-Key-Change-This"

            # ============ Service Endpoints (from original config) ============
            - name: SEARCHSERVICE_BASE
              value: "http://catalogsearch:5013"
            - name: METADATASERVICE_BASE
              value: "http://catalogmetadata:5014"
            - name: REQUEST_SESSION_TIMEOUT_SEC
              value: "15"
          command:
            - sh
            - -c
            - |
              echo "================================================"
              echo "Copying custom auth files to Amundsen directory..."
              echo "================================================"
              
              # Ensure target directories exist
              mkdir -p /amundsen/amundsen_application/static/css
              mkdir -p /amundsen/amundsen_application/templates
              
              cp -v /app-files/custom_auth_config.py /amundsen/amundsen_application/
              cp -v /app-files/templates/login.html /amundsen/amundsen_application/templates/
              cp -v /app-files/static/css/login.scss /amundsen/amundsen_application/static/css/
              
              echo ""
              echo "Verifying files:"
              ls -la /amundsen/amundsen_application/ | grep custom_auth || echo "⚠ custom_auth_config.py not found"
              ls -la /amundsen/amundsen_application/templates/ | grep login || echo "⚠ login.html not found"
              ls -la /amundsen/amundsen_application/static/css/ | grep login || echo "⚠ login.scss not found"
              
              echo ""
              echo "First 10 lines of login.scss:"
              head -10 /amundsen/amundsen_application/static/css/login.scss
              
              echo ""
              echo "================================================"
              echo "Starting Gunicorn with custom authentication..."
              echo "================================================"
              exec gunicorn -w 2 --bind :5015 --timeout 120 amundsen_application.wsgi
          volumeMounts:
            - name: app-files
              mountPath: /app-files
          resources:
            limits:
              memory: "768Mi"
              cpu: "500m"
            requests:
              memory: "384Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 5015
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 5015
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: custom-auth
          configMap:
            name: custom-auth-config
        - name: login-template
          configMap:
            name: login-template
        - name: login-scss
          configMap:
            name: login-scss
        - name: app-files
          emptyDir: {}
---
# ==============================================================================
# TRAEFIK MIDDLEWARES
# ==============================================================================

# Strip /optimusdb1 prefix
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: optimusdb1-stripprefix
  namespace: optimusddc
spec:
  stripPrefix:
    prefixes:
      - /optimusdb1
---
# Strip /optimusdb2 prefix
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: optimusdb2-stripprefix
  namespace: optimusddc
spec:
  stripPrefix:
    prefixes:
      - /optimusdb2
---
# Strip /optimusdb3 prefix
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: optimusdb3-stripprefix
  namespace: optimusddc
spec:
  stripPrefix:
    prefixes:
      - /optimusdb3
---
# ==============================================================================
# KEYCLOAK ROUTE (Highest Priority - Add this FIRST)
# ==============================================================================
# Route: /auth/* and /realms/* → Keycloak Admin Console and OIDC endpoints
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak-auth
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/auth`) || PathPrefix(`/realms`)
      kind: Rule
      priority: 110
      services:
        - name: keycloak
          port: 8080
---
# ==============================================================================
# Strategy:
# 1. BACKWARD COMPATIBILITY: /swarmkb/command → node 1 only
# 2. LOAD-BALANCED: Other /swarmkb/* endpoints → round-robin all nodes
# 3. NODE-SPECIFIC: /optimusdbX/* → specific node
# ==============================================================================

# ------------------------------------------------------------------------------
# BACKWARD COMPATIBILITY ROUTE (Highest Priority)
# ------------------------------------------------------------------------------
# Route: /swarmkb/command → OptimusDB Node 1 ONLY
# This maintains backward compatibility with existing code that expects
# /swarmkb/command to go to the primary node
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: optimusdb-command-compat
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/swarmkb/command`)
      kind: Rule
      priority: 100  # Highest priority to match before load-balanced route
      services:
        - name: optimusdb1
          port: 8089
---
# ------------------------------------------------------------------------------
# LOAD-BALANCED ROUTES (Medium Priority)
# ------------------------------------------------------------------------------
# These routes distribute requests across ALL healthy OptimusDB nodes
# using Traefik's built-in round-robin load balancing
# ------------------------------------------------------------------------------

# Route: /swarmkb/agent/status → Load-balanced across all nodes
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: optimusdb-agent-status-lb
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/swarmkb/agent/status`)
      kind: Rule
      priority: 50
      services:
        - name: optimusdb1
          port: 8089
        - name: optimusdb2
          port: 8089
        - name: optimusdb3
          port: 8089
---
# Route: /swarmkb/agent/inventory → Load-balanced across all nodes
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: optimusdb-agent-inventory-lb
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/swarmkb/agent/inventory`)
      kind: Rule
      priority: 50
      services:
        - name: optimusdb1
          port: 8089
        - name: optimusdb2
          port: 8089
        - name: optimusdb3
          port: 8089
---
# Route: /swarmkb/log → Load-balanced across all nodes
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: optimusdb-log-lb
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/swarmkb/log`)
      kind: Rule
      priority: 50
      services:
        - name: optimusdb1
          port: 8089
        - name: optimusdb2
          port: 8089
        - name: optimusdb3
          port: 8089
---
# Route: /swarmkb/* (Catch-all) → Load-balanced across all nodes
# This catches any other /swarmkb endpoints not explicitly routed above
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: optimusdb-swarmkb-lb
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/swarmkb`)
      kind: Rule
      priority: 10  # Lower priority so specific routes match first
      services:
        - name: optimusdb1
          port: 8089
        - name: optimusdb2
          port: 8089
        - name: optimusdb3
          port: 8089
---
# ------------------------------------------------------------------------------
# NODE-SPECIFIC ROUTES (Low Priority)
# ------------------------------------------------------------------------------
# These routes allow the frontend to target specific nodes when needed
# (e.g., ClusterTopologyPage querying a specific node's status)
# ------------------------------------------------------------------------------

# Route: /optimusdb1/* → OptimusDB Node 1
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: optimusdb-node-1
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/optimusdb1`)
      kind: Rule
      priority: 5
      middlewares:
        - name: optimusdb1-stripprefix
      services:
        - name: optimusdb1
          port: 8089
---
# Route: /optimusdb2/* → OptimusDB Node 2
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: optimusdb-node-2
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/optimusdb2`)
      kind: Rule
      priority: 5
      middlewares:
        - name: optimusdb2-stripprefix
      services:
        - name: optimusdb2
          port: 8089
---
# Route: /optimusdb3/* → OptimusDB Node 3
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: optimusdb-node-3
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/optimusdb3`)
      kind: Rule
      priority: 5
      middlewares:
        - name: optimusdb3-stripprefix
      services:
        - name: optimusdb3
          port: 8089
---
# ------------------------------------------------------------------------------
# CATALOG SERVICES ROUTES
# ------------------------------------------------------------------------------

# Route: /api/v1/metadata/* → CatalogMetadata
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catalogmetadata-api
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/api/v1/metadata`)
      kind: Rule
      services:
        - name: catalogmetadata
          port: 5014
---
# Route: /api/v1/search/* → CatalogSearch
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catalogsearch-api
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/api/v1/search`)
      kind: Rule
      services:
        - name: catalogsearch
          port: 5013
---
# ------------------------------------------------------------------------------
# NEW: CHAT API ROUTE → Load-balanced to OptimusDB nodes
# ------------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: optimusdb-chat-api
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/api/v1/chat`)
      kind: Rule
      priority: 60
      services:
        - name: optimusdb1
          port: 8089
        - name: optimusdb2
          port: 8089
        - name: optimusdb3
          port: 8089
---
# ------------------------------------------------------------------------------
# NEW: Semantic Search API → Node-specific (use /optimusdbN/api/v1/semantic/...)
# Also expose as load-balanced for convenience
# ------------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: optimusdb-semantic-api
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/api/v1/semantic`)
      kind: Rule
      priority: 60
      services:
        - name: optimusdb1
          port: 8089
        - name: optimusdb2
          port: 8089
        - name: optimusdb3
          port: 8089
---
# Route: / → CatalogFrontend ( UI - default/root)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catalogfrontend-root
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: catalogfrontend
          port: 5015

# ==============================================================================
# ROUTING SUMMARY
# ==============================================================================
#
# BACKWARD COMPATIBILITY (Priority 100):
#   /swarmkb/command → optimusdb1 ONLY
#
# LOAD-BALANCED (Priority 50):
#   /swarmkb/agent/status → round-robin [optimusdb1, optimusdb2, optimusdb3]
#   /swarmkb/agent/inventory → round-robin [optimusdb1, optimusdb2, optimusdb3]
#   /swarmkb/log → round-robin [optimusdb1, optimusdb2, optimusdb3]
#
# CATCH-ALL LOAD-BALANCED (Priority 10):
#   /swarmkb/* → round-robin [optimusdb1, optimusdb2, optimusdb3]
#
# NODE-SPECIFIC (Priority 5):
#   /optimusdb1/* → optimusdb1 (stripprefix /optimusdb1)
#   /optimusdb2/* → optimusdb2 (stripprefix /optimusdb2)
#   /optimusdb3/* → optimusdb3 (stripprefix /optimusdb3)
#
# CATALOG SERVICES:
#   /api/v1/metadata/* → catalogmetadata
#   /api/v1/search/* → catalogsearch
#   / → catalogfrontend
#
# USAGE EXAMPLES:
#
# Backward compatible command:
#   POST /swarmkb/command → Always goes to node 1
#
# Load-balanced status check:
#   GET /swarmkb/agent/status → Distributed across all nodes
#
# Query specific node:
#   GET /optimusdb2/swarmkb/agent/status → Always goes to node 2
#
# ==============================================================================
#
# ==============================================================================
# NEW: LLAMA-SERVER SERVICES (port 8080)
# ==============================================================================
# The existing optimusdbN ClusterIP services only expose port 8089 (Go app).
# These new services expose port 8080 on the same pods so Traefik can route
# to llama-server directly without touching the Go application.
# Selector matches the same pods as the existing optimusdbN services.
---
apiVersion: v1
kind: Service
metadata:
  name: optimusdb1-llama
  namespace: optimusddc
  labels:
    app: optimusdb
    node: "1"
    component: llama
spec:
  type: ClusterIP
  selector:
    app: optimusdb
    node: "1"
  ports:
    - name: llama
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: optimusdb2-llama
  namespace: optimusddc
  labels:
    app: optimusdb
    node: "2"
    component: llama
spec:
  type: ClusterIP
  selector:
    app: optimusdb
    node: "2"
  ports:
    - name: llama
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: optimusdb3-llama
  namespace: optimusddc
  labels:
    app: optimusdb
    node: "3"
    component: llama
spec:
  type: ClusterIP
  selector:
    app: optimusdb
    node: "3"
  ports:
    - name: llama
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# ==============================================================================
# NEW: EMBEDDING MIDDLEWARES
# ==============================================================================
#
# IP allowlist: restricts /embedding access to cluster-internal traffic only.
# The embedding endpoint runs CPU-bound inference — unrestricted external access
# would allow anyone reaching 193.225.250.240 to exhaust CPU resources for free.
#
# Allowed source ranges:
#   127.0.0.1/32         localhost — host-level scripts and deploy script
#   193.225.250.240/32   host public IP — self-calls from the server
#   10.42.0.0/16         K3s pod CIDR — all pods in the cluster
#   10.43.0.0/16         K3s service CIDR — ClusterIP services
#
# To allow an additional external IP (e.g. a research workstation or CI runner),
# add it to the sourceRange list below and kubectl apply the manifest.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: embedding-ipallowlist
  namespace: optimusddc
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32          # localhost — host-level scripts and deploy script
      - 193.225.250.240/32    # host public IP — self-calls from the server
      - 10.42.0.0/16          # K3s pod CIDR — all pods in the cluster
      - 10.43.0.0/16          # K3s service CIDR — ClusterIP services
---
# Strip /optimusdb1/embedding → /embedding before forwarding to llama-server.
# Each node needs its own middleware because stripPrefix is path-specific.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: embedding-node1-stripprefix
  namespace: optimusddc
spec:
  stripPrefix:
    prefixes:
      - /optimusdb1/embedding
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: embedding-node2-stripprefix
  namespace: optimusddc
spec:
  stripPrefix:
    prefixes:
      - /optimusdb2/embedding
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: embedding-node3-stripprefix
  namespace: optimusddc
spec:
  stripPrefix:
    prefixes:
      - /optimusdb3/embedding
---
# ==============================================================================
# NEW: EMBEDDING INGRESSROUTES (Priority 8)
# ==============================================================================
#
# Priority 8 — above the generic /optimusdbN/* catch-all (priority 5) so these
# routes match BEFORE the Go app routes strip the prefix to port 8089.
# Targets port 8080 (llama-server) directly, not port 8089 (Go app).
#
# Access pattern after this change:
#   POST http://193.225.250.240/optimusdb1/embedding  → node 1 llama-server
#   POST http://193.225.250.240/optimusdb2/embedding  → node 2 llama-server
#   POST http://193.225.250.240/optimusdb3/embedding  → node 3 llama-server
#
# Route: /optimusdb1/embedding → optimusdb1-llama:8080 (llama-server node 1)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: optimusdb1-embedding
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/optimusdb1/embedding`)
      kind: Rule
      priority: 8
      middlewares:
        - name: embedding-ipallowlist
        - name: embedding-node1-stripprefix
      services:
        - name: optimusdb1-llama
          port: 8080
---
# Route: /optimusdb2/embedding → optimusdb2-llama:8080 (llama-server node 2)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: optimusdb2-embedding
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/optimusdb2/embedding`)
      kind: Rule
      priority: 8
      middlewares:
        - name: embedding-ipallowlist
        - name: embedding-node2-stripprefix
      services:
        - name: optimusdb2-llama
          port: 8080
---
# Route: /optimusdb3/embedding → optimusdb3-llama:8080 (llama-server node 3)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: optimusdb3-embedding
  namespace: optimusddc
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/optimusdb3/embedding`)
      kind: Rule
      priority: 8
      middlewares:
        - name: embedding-ipallowlist
        - name: embedding-node3-stripprefix
      services:
        - name: optimusdb3-llama
          port: 8080

# ==============================================================================
# UPDATED ROUTING SUMMARY (additions to existing routing summary above)
# ==============================================================================
#
# EMBEDDING ENDPOINTS — NEW (Priority 8, IP-restricted):
