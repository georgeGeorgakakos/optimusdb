[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimus-capacity"
version = "1.0.0"
description = "Client for the OptimusDB Capacity Registry — agent-issued capacity identifiers for the Swarmchestrate CP/RA flow"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ICCS / Swarmchestrate" }]
keywords = ["optimusdb", "swarmchestrate", "tosca", "capacity", "decentralized"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
# YAML CDTs. Not required if you only ever pass .json templates.
yaml = ["PyYAML>=6.0"]
dev = [
    "PyYAML>=6.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
optimus-capacity = "capacity_client:main"

[project.urls]
Homepage = "https://github.com/georgeGeorgakakos/optimusCapacity"
"OptimusDB" = "https://github.com/georgeGeorgakakos/optimusdb-lsa"
"Python client" = "https://github.com/georgeGeorgakakos/optimusPy"

[tool.setuptools]
py-modules = ["capacity_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "integration: runs against a real agent; set OPTIMUS_TEST_URL",
]
