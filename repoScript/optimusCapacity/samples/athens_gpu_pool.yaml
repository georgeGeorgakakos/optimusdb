tosca_definitions_version: tosca_simple_yaml_1_3

metadata:
  template_name: athens-edge-gpu-pool-3
  template_author: ICCS Edge Cluster
  template_version: 1.0.0
  kb_datastore: Capacities

description: >
  Capacity Description Template for a GPU-backed edge compute pool
  operated by ICCS in Athens. Submitted against an OptimusDB-issued capID.

topology_template:
  node_templates:
    gpu_pool:
      type: tosca.nodes.Compute
      capabilities:
        host:
          properties:
            num_cpus: 64
            mem_size: 256 GB
            disk_size: 4 TB
        os:
          properties:
            architecture: x86_64
            type: Linux
            distribution: Ubuntu
            version: "22.04"
      properties:
        accelerator: NVIDIA A100
        accelerator_count: 4
        region: eu-gr-athens
        availability: 0.995

  policies:
    - placement:
        type: tosca.policies.Placement
        properties:
          region: eu-gr-athens
          latency_class: edge
