name: Build and publish CIPHER image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.cipher"
      - "docker/cipher-entrypoint.sh"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/publish-ghcr-cipher.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ggkioka/optimusdb

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cipher
            type=sha,prefix=cipher-
          labels: |
            org.opencontainers.image.title=OptimusDB CIPHER build
            org.opencontainers.image.description=OptimusDB image configured for the CIPHER Open Call
            org.opencontainers.image.source=https://github.com/ggkioka/optimusdb
            org.opencontainers.image.licenses=MPL-2.0

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cipher
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
